    <!-- 404 fallback GitHub/Cloudflare Pages: copy dari p/base.html.
         Pretty URL /p/<Judul> tetap cantik tanpa rewrite server.
         Header, iklan, footer sudah ditanam langsung (anti fetch gagal). -->
    <script>
    (function () {
        try {
            var p = window.location.pathname;
            // Hanya tangani /p/<judul>, selain itu lempar ke not_found.html
            if (!/\/p\/[^\/]+\/?$/.test(p)) {
                var prefix = p.split("/p/")[0];
                window.location.replace(prefix + "/not_found.html");
            }
        } catch (e) {}
    })();
    </script>
