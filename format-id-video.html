<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Format ID Video → id-video.json</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: radial-gradient(1200px 600px at 50% -100px, #1c1022 0%, #0a0a0a 55%) fixed, #0a0a0a;
    color: #eee; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px;
  }
  .wrap { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 22px; letter-spacing: .5px; padding-left: 10px; border-left: 4px solid #a200f9; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .topnav { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 0; margin: 14px 0 4px; border-bottom: 1px solid #222; }
  .topnav button { margin: 0; }
  .topnav.links a {
    background: linear-gradient(180deg, #262626, #1b1b1b);
    border: 1px solid #3a3a3a; color: #fff; text-decoration: none;
    padding: 9px 16px; border-radius: 5px; font-size: 14px; font-weight: 600;
    transition: transform .15s, box-shadow .15s, border-color .15s;
  }
  .topnav.links a:hover { border-color: #a200f9; box-shadow: 0 0 12px rgba(162,0,249,.35); transform: translateY(-1px); }
  .topnav.links a.red { background: linear-gradient(180deg, #b44dff, #7d00bf); border-color: #a200f9; }
  .topnav.links a.red:hover { box-shadow: 0 0 14px rgba(162,0,249,.5); }
  .panel { border: 1px solid #333; border-radius: 14px; background: rgba(255,255,255,.015); padding: 6px 18px 22px; margin-top: 4px; }
  label { display: block; margin: 14px 0 6px; font-weight: 700; color: #ddd; font-size: 14px; }
  input[type=text], textarea, select {
    width: 100%; background: #141414; border: 1px solid #333; color: #fff;
    border-radius: 8px; padding: 10px; font-size: 14px;
    transition: border-color .15s, box-shadow .15s;
  }
  input[type=text]:focus, textarea:focus, select:focus {
    outline: none; border-color: #a200f9; box-shadow: 0 0 10px rgba(162,0,249,.25);
  }
  textarea { min-height: 110px; font-family: monospace; }
  button {
    background: linear-gradient(180deg, #b44dff, #7d00bf); border: 1px solid #a200f9;
    color: #fff; padding: 10px 20px;
    font-size: 15px; font-weight: 700; border-radius: 6px; cursor: pointer; margin: 10px 5px 0 0;
    transition: box-shadow .15s, transform .15s;
  }
  button:hover { box-shadow: 0 0 12px rgba(162,0,249,.4); transform: translateY(-1px); }
  button.ghost { background: linear-gradient(180deg, #2a2a2a, #1d1d1d); border: 1px solid #3a3a3a; }
  button.ghost:hover { border-color: #a200f9; box-shadow: 0 0 10px rgba(162,0,249,.25); }
  pre {
    background: #141414; border: 1px solid #2a2a2a; border-radius: 12px;
    padding: 12px; white-space: pre-wrap; word-break: break-all; font-size: 13px;
    max-height: 320px; overflow: auto;
  }
  .info { color: #ffa74e; font-size: 14px; }
  .warn { color: #ff5555; font-size: 14px; font-weight: 700; }
  .ok { color: #4dff88; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>Format ID Video → id-video.json</h1>
  </div>
  <nav class="topnav links">
    <a href="dash/index.html">Home</a>
    <a href="index.html" target="_blank" rel="noopener">Lihat Situs</a>
    <a href="dash/statistik.html" target="_blank" rel="noopener">Dashboard Statistik</a>
    <a href="format-video.html" target="_blank" rel="noopener">Format Video</a>
    <a class="red" href="format-id-video.html">Format ID Video</a>
  </nav>
  <div class="panel">
  <p class="info">Isi link + tempel ID abyss (1 baris 1 ID) + tempel URL gambar episode (1 baris 1 URL) → otomatis jadi entry siap tempel ke "videos".</p>

  <label for="selFile">File target</label>
  <select id="selFile">
    <option value="id-video.json">id-video.json</option>
    <option value="id-video2.json">id-video2.json</option>
    <option value="id-video3.json">id-video3.json</option>
    <option value="id-video4.json">id-video4.json</option>
    <option value="id-video5.json">id-video5.json</option>
    <option value="video-data.json">video-data.json (cadangan)</option>
  </select>
  <div id="fileInfo" class="info"></div>

  <label for="inLink">Link (harus sama dengan daftar.json, pakai .html)</label>
  <input type="text" id="inLink" placeholder="Sister Breeder.html">

  <label for="inIds">ID abyssplayer (1 baris 1 ID, tanpa URL penuh)</label>
  <textarea id="inIds" placeholder="nq2I-qPOx&#10;qSbh-PnZPa&#10;23aQF9_WG"></textarea>

  <label for="inImgs">URL gambar episode (1 baris 1 URL, boleh kosong)</label>
  <textarea id="inImgs" placeholder="https://i.ibb.co.com/xxx/ep2.jpg&#10;https://i.ibb.co.com/xxx/ep1.jpg"></textarea>
  <label style="display:flex;align-items:center;gap:8px;font-weight:400;margin-top:8px;">
    <input type="checkbox" id="revImgs" checked style="width:auto;"> Balik urutan gambar: baris paling <b>bawah</b> = episode 1 (index 0)
  </label>

  <div id="statUrl" class="info"></div>
  <div id="warnUrl" class="warn"></div>
  <div id="dupInfo" class="warn"></div>
  <span id="copyMsg" class="ok"></span>

  <label>Hasil (siap tempel ke "videos" di id-video.json)</label>
  <pre id="outEntry">...</pre>
  <button id="btnCopy">Salin Entry</button>
  <button id="btnClear" class="ghost">Hapus Semua</button>
  </div>

</div>

<script>
  var inLink = document.getElementById('inLink');
  var inIds = document.getElementById('inIds');
  var inImgs = document.getElementById('inImgs');
  var outEntry = document.getElementById('outEntry');
  var statUrl = document.getElementById('statUrl');
  var warnUrl = document.getElementById('warnUrl');
  var copyMsg = document.getElementById('copyMsg');
  var selFile = document.getElementById('selFile');
  var fileInfo = document.getElementById('fileInfo');
  var dupInfo = document.getElementById('dupInfo');
  var currentKeys = [];

  function normLink(v) {
    v = (v || '').trim();
    if (v && !/\.html$/i.test(v)) v += '.html';
    return v;
  }

  function parseLines(txt, onlyUrl) {
    var parts = (txt || '').split(/\s+/);
    var out = [];
    var bad = 0;
    for (var i = 0; i < parts.length; i++) {
      var u = parts[i].trim().replace(/,$/, '').replace(/^"|"$/g, '');
      if (!u) continue;
      if (onlyUrl) {
        if (/^https?:\/\//i.test(u)) out.push(u);
        else bad++;
      } else {
        out.push(u);
      }
    }
    return { list: out, bad: bad };
  }

  function loadFile() {
    copyMsg.textContent = '';
    var name = selFile.value;
    fileInfo.textContent = 'memuat ' + name + ' ...';
    fetch('p/' + name + '?t=' + Date.now())
      .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(data) {
        var src = data.videos ? data.videos : data;
        currentKeys = Object.keys(src).filter(function(k){ return k.charAt(0) !== '_'; });
        fileInfo.textContent = name + ': ' + currentKeys.length + ' entri.';
        render();
      })
      .catch(function(err) {
        currentKeys = [];
        fileInfo.textContent = name + ' gagal dimuat (' + err.message + ') — cek duplikat nonaktif.';
        render();
      });
  }

  function render() {
    var link = normLink(inLink.value);
    var rIds = parseLines(inIds.value, false);
    var rImgs = parseLines(inImgs.value, true);
    statUrl.textContent = rIds.list.length + ' ID + ' + rImgs.list.length + ' gambar terdeteksi';
    var warns = [];
    if (rImgs.bad > 0) warns.push(rImgs.bad + ' baris gambar bukan URL (diabaikan)');
    if (rIds.list.length === 0) warns.push('videoIds masih kosong');
    if (rImgs.list.length > 0 && rImgs.list.length !== rIds.list.length) warns.push('jumlah gambar (' + rImgs.list.length + ') != jumlah ID (' + rIds.list.length + ') — boleh, tapi cek lagi');
    warnUrl.textContent = warns.join(' | ');
    var dup = link && currentKeys.indexOf(link) !== -1;
    dupInfo.textContent = dup ? ('PERINGATAN: ' + link + ' SUDAH ADA di ' + selFile.value) : '';
    var imgList = rImgs.list.slice();
    if (document.getElementById('revImgs').checked) imgList.reverse();
    var imgsObj = {};
    imgList.forEach(function(u, i){ imgsObj[String(i)] = u; });
    var entry = '"' + link + '": {\n'
      + '  "link": "' + link + '",\n'
      + '  "videoIds": ' + JSON.stringify(rIds.list) + ',\n'
      + '  "episodeImages": ' + JSON.stringify(imgsObj) + '\n'
      + '}';
    outEntry.textContent = link ? entry : '...';
    return entry;
  }

  inLink.addEventListener('input', render);
  inIds.addEventListener('input', render);
  inImgs.addEventListener('input', render);
  document.getElementById('revImgs').addEventListener('change', render);
  selFile.addEventListener('change', loadFile);
  render();

  document.getElementById('btnCopy').addEventListener('click', function() {
    var txt = render();
    function done() { copyMsg.textContent = 'tersalin! Tempel ke "videos" di id-video.json'; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done, function() { fallback(); });
    } else { fallback(); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = txt;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      document.body.removeChild(ta);
    }
  });

  document.getElementById('btnClear').addEventListener('click', function() {
    inLink.value = '';
    inIds.value = '';
    inImgs.value = '';
    copyMsg.textContent = '';
    render();
  });

  loadFile();
</script>
</body>
</html>
